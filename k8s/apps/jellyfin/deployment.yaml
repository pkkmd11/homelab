apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:preview
          ports:
            - name: http
              containerPort: 8096

          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          volumeMounts:
            - name: jellyfin-config
              mountPath: /config

            - name: movies
              mountPath: /media/movies

            - name: tv
              mountPath: /media/tv

            - name: music
              mountPath: /media/music

      volumes:
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config

        - name: movies
          hostPath:
            path: /media/movies
            type: Directory

        - name: tv
          hostPath:
            path: /media/tv
            type: Directory

        - name: music
          hostPath:
            path: /media/music
            type: Directory
